<!DOCTYPE html>
<html>
<head>
    <title>Edit Fee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Edit Fee</h2>

    <form method="post" class="row g-3">
        {% csrf_token %}

        <div class="col-md-3">{{ form.sport.label_tag }} {{ form.sport }}</div>
        <div class="col-md-3">{{ form.batch.label_tag }} {{ form.batch }}</div>
        <div class="col-md-3">{{ form.expertise.label_tag }} {{ form.expertise }}</div>
        <div class="col-md-3">{{ form.duration.label_tag }} {{ form.duration }}</div>
        <div class="col-md-3">{{ form.fees.label_tag }} {{ form.fees }}</div>

        <div class="col-md-12">
            <button type="submit" class="btn btn-success">Update</button>
            <a href="{% url 'fee_structure' %}" class="btn btn-secondary">Back</a>
        </div>
    </form>
</div>

</body>
</html>
